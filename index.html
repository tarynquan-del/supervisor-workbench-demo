<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>督导移动端 · 工作台</title>
<style>
  :root{
    --primary:#5B6CFF; --hover:#4A5AF0; --end:#7D7BFF;
    --track:#D6E4FF; --line:#EDEEF6; --wash:#F4FBFF; --wash2:#FFF9FC;
    --t1:#212121; --t2:#333; --t3:#666; --t4:#999;
    --done:#14BB95; --warn:#FF6838;
    --card:20px; --btn:25px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:"Mark Pro","思源黑体","Source Han Sans SC","Noto Sans SC",sans-serif;
    background:#EDF0FA;display:flex;justify-content:center;align-items:center;}
  .demo-shell{display:flex;align-items:center;gap:34px;padding:28px;}
  .phone{width:375px;height:812px;position:relative;overflow:hidden;flex-shrink:0;
    background:radial-gradient(240px 180px at 92% 0%,rgba(125,123,255,.14),transparent 70%),
               radial-gradient(220px 180px at 0% 88%,rgba(214,228,255,.8),transparent 68%),
               linear-gradient(180deg,var(--wash2),var(--wash) 46%,#fff 100%);
    box-shadow:0 12px 40px rgba(91,108,255,.16);}
  .page{position:absolute;inset:0 0 68px;padding:20px 20px 28px;overflow-y:auto;z-index:1;}
  .page.hidden{display:none!important;pointer-events:none;visibility:hidden;}
  .page.hidden,.sheet.hidden,.overlay.hidden{display:none;}
  .card{background:#fff;border-radius:var(--card);box-shadow:0 6px 12px rgba(91,108,255,.16);}
  h1{font-size:24px;font-weight:800;color:var(--t1);}
  .sub{font-size:12px;color:var(--t4);margin-top:4px;}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;}
  .sec h2{font-size:16px;font-weight:800;}
  .link{font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;background:none;border:none;font-family:inherit;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
  .kpi{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 6px 12px rgba(91,108,255,.1);}
  .kpi b{display:block;font-size:18px;} .kpi span{font-size:10px;color:var(--t4);}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;width:100%;text-align:left;background:none;border:none;font-family:inherit;color:inherit;}
  .row + .row{border-top:1px solid var(--line);}
  .ico{width:42px;height:42px;border-radius:12px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .bd{flex:1;min-width:0;}
  .bd .t{font-size:14px;font-weight:800;margin-bottom:3px;}
  .bd .s{font-size:11.5px;color:var(--t3);line-height:1.45;}
  .tag{display:inline-flex;font-size:10px;font-weight:800;padding:2px 8px;border-radius:100px;background:#EEF0FF;color:var(--primary);white-space:nowrap;}
  .tag.warn{background:#FFF1EB;color:var(--warn);} .tag.ok{background:#E6F9F4;color:var(--done);}
  .cta{width:100%;height:49px;border:none;border-radius:var(--btn);background:var(--primary);color:#fff;
    font:800 15px "Mark Pro","思源黑体",sans-serif;box-shadow:0 6px 16px #AFCCFF;cursor:pointer;}
  .cta:active{background:var(--hover);}
  .cta.ghost{background:#EEF0FF;color:var(--primary);box-shadow:none;}
  .cta.sm{height:36px;width:auto;padding:0 14px;font-size:12px;box-shadow:none;}
  .act-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
  .act-btn{height:40px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border:1px solid #D6E4FF;border-radius:20px;background:#fff;font-family:inherit;color:#212121;font-size:13px;font-weight:800;box-shadow:0 4px 10px rgba(91,108,255,.1);cursor:pointer;}
  .act-btn .ico{width:22px;height:22px;border-radius:8px;background:#EEF0FF;color:var(--primary);font-size:12px;}
  .act-btn.primary{background:#F4F5FF;}
  .grade-tag{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;}
  .grade-tag.S{background:var(--primary);color:#fff;}
  .grade-tag.A{background:#EEF0FF;color:var(--primary);}
  .grade-tag.B{background:#F3F4F8;color:#666;}
  .grade-tag.C{background:#F6F6F8;color:#999;}
  .so-card{padding:10px 12px;margin-bottom:6px;}
  #p-stores{display:flex;flex-direction:column;padding:16px 16px 10px;}
  #p-stores .so-head h1{font-size:22px;}
  #p-stores .so-tabs{margin:8px 0;}
  #storeList{flex:1;min-height:0;}
  #p-stores .so-more{width:100%;margin-top:8px;border:0;background:none;color:var(--primary);font:800 12px inherit;cursor:pointer;}
  .so-card.dim{opacity:.62;box-shadow:none;}
  .so-card.dim .tk{color:#8A93B0;}
  .so-card.dim .so-name > button{cursor:default;}
  .so-wait{color:var(--primary);font-size:11px;font-weight:800;white-space:nowrap;}
  .so-name{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .so-name > button{flex:1;min-width:0;overflow:hidden;background:none;border:0;padding:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer;}
  .so-name b{display:flex;align-items:center;gap:6px;font-size:14px;color:#1F2437;min-width:0;}
  .so-name .tk{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .so-name .grade-tag{width:18px;height:18px;font-size:10px;border-radius:6px;}
  .so-go-pri{background:var(--primary);color:#fff;}
  .so-acts{display:flex;align-items:center;gap:6px;flex-shrink:0;position:relative;z-index:1;}
  .so-ico{width:30px;height:30px;border:0;border-radius:50%;background:#F4F6FF;color:#5B6CFF;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .so-ico svg{width:15px;height:15px;}
  .st-title{display:flex;align-items:center;gap:8px;min-width:0;}
  .st-title h1{font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .st-title .so-ico{width:34px;height:34px;flex-shrink:0;}
  .st-title .so-ico svg{width:16px;height:16px;}
  .so-go{height:30px;padding:0 10px;border:0;border-radius:15px;background:#EEF0FF;color:var(--primary);font:800 12px inherit;cursor:pointer;}
  .so-card.patrolled .so-go{height:26px;padding:0 8px;font-size:10px;border-radius:13px;}
  .so-meta{margin-top:4px;color:#7A84A3;font-size:11px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #p-collab{background:linear-gradient(180deg,#F4FBFF 0,#fff 42%);}
  #p-collab .so-head{align-items:flex-start;}
  .co-acts{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin:14px 0 2px;}
  .co-acts .cta{height:48px;font-size:15px;}
  .co-acts .cta.ghost{height:48px;}
  .so-mini{display:flex;align-items:center;gap:10px;margin-top:8px;color:#7A84A3;font-size:11px;}
  .so-mini b{color:#1F2437;}
  .so-report{display:flex;align-items:center;justify-content:space-between;width:100%;height:34px;margin-top:8px;padding:0 12px;border:0;border-radius:12px;background:#EEF0FF;color:var(--primary);font:800 11px inherit;cursor:pointer;}
  .so-report em{font-style:normal;color:#8A93B0;font-size:10px;font-weight:700;}
  .so-report.busy{background:#F4F6FF;color:#8A93B0;}
  .rp-kicker{font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.06em;}
  .rp-sum{padding:16px;margin-top:12px;}
  .rp-sum p{margin-top:8px;color:#4C5678;font-size:13px;line-height:1.65;}
  .rp-item{padding:12px 16px;border-bottom:1px solid var(--line);}
  .rp-item:last-child{border-bottom:0;}
  .rp-item b{display:block;font-size:13px;color:#1F2437;}
  .rp-item small{display:block;margin-top:4px;color:#667089;font-size:12px;line-height:1.5;}
  .so-alert{margin-top:10px;padding:8px 10px;border-radius:10px;background:#F4F6FF;color:#4C5678;font-size:11px;line-height:1.45;}
  .so-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .st-acts{display:grid;grid-template-columns:1fr 1.75fr;gap:8px;align-items:center;margin-top:16px;}
  .st-acts .cta{height:56px;font-size:16px;}
  .st-acts .cta.ghost{height:44px;font-size:13px;box-shadow:none;}
  .so-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .so-head > div{flex:1;min-width:0;}
  .so-tabs{display:flex;gap:18px;overflow-x:auto;margin:12px 0 10px;border-bottom:1px solid #EEF0F6;}
  .so-tabs::-webkit-scrollbar{display:none;}
  .so-tabs button{flex:0 0 auto;height:36px;border:0;background:none;color:#8A93B0;font:800 13px inherit;padding:0;cursor:pointer;}
  .so-tabs button.on{color:#1F2437;box-shadow:inset 0 -2px 0 var(--primary);}
  .sheet.hidden,.overlay.hidden,.overlay:empty{display:none!important;pointer-events:none;}
  .so-search-btn{width:36px;height:36px;flex:0 0 36px;border:0;border-radius:12px;background:#fff;color:var(--primary);box-shadow:0 6px 12px rgba(91,108,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;z-index:2;}
  .so-search-btn.on,.so-search-btn.hot{background:var(--primary);color:#fff;}
  .so-search-btn svg{width:18px;height:18px;}
  .so-search-btn i{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn);}
  .so-lab{margin:12px 0 6px;color:#8A93B0;font-size:11px;font-weight:800;}
  .call-ui{text-align:center;padding:8px 0 4px;}
  .call-ui .me-ava{margin:8px auto 12px;}
  .call-ui h3{font-size:18px;}
  .call-pulse{width:14px;height:14px;border-radius:50%;background:var(--done);margin:10px auto 0;box-shadow:0 0 0 6px rgba(20,187,149,.16);animation:asrPulse 1.2s ease-in-out infinite;}
  .call-pulse.rec{background:var(--warn);box-shadow:0 0 0 6px rgba(255,104,56,.16);}
  .call-rec{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:12px 0 0;padding:12px 14px;border:0;border-radius:14px;background:#F4F6FF;text-align:left;font-family:inherit;cursor:pointer;}
  .call-rec b{display:block;font-size:13px;color:#30385A;}
  .call-rec small{display:block;margin-top:3px;color:#7A84A3;font-size:11px;}
  .call-rec.on{background:#FFF1EB;}
  .call-rec.on b{color:var(--warn);}
  .call-rec .switch{pointer-events:none;}
  .grow-card{padding:16px;}
  .grow-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .grow-pts{display:block;margin-top:2px;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;}
  .grow-card .bar{margin:12px 0 6px;}
  .grow-card .nums{margin:14px 0 0;}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .badge{font-size:10px;font-weight:800;padding:5px 9px;border-radius:100px;background:#F4F5FF;color:var(--primary);}
  #p-me{padding:0;background:linear-gradient(180deg,#EAF1FF 0,#F3F7FF 36%,#fff 58%);}
  .me-hero{padding:22px 16px 0;text-align:center;}
  .me-kicker{font-size:17px;font-weight:850;letter-spacing:-.03em;color:#1F2437;}
  .me-kicker:before,.me-kicker:after{content:"✦";margin:0 8px;color:#8EA0FF;font-size:12px;}
  .me-user{margin:8px 0 18px;color:#7A84A3;font-size:12px;line-height:1.45;}
  .me-user b{color:#30385A;}
  .me-tabs{display:grid;grid-template-columns:1fr 1fr;align-items:end;}
  .me-tabs button{height:48px;border:0;background:transparent;color:#8A93B0;font:800 15px inherit;cursor:pointer;}
  .me-tabs button.on{background:#fff;color:#1F2437;border-radius:20px 20px 0 0;}
  .me-panel{background:#fff;padding:16px 16px 22px;min-height:calc(100% - 168px);}
  .me-compare{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;padding:14px 12px;border-radius:16px;background:#F6F8FF;}
  .me-col{text-align:left;}
  .me-col .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:#C5CBE6;vertical-align:middle;}
  .me-col.on .dot{background:var(--done);}
  .me-col small{display:block;margin-bottom:8px;color:#8A93B0;font-size:10px;font-weight:800;}
  .me-col b{display:block;font-size:22px;letter-spacing:-.04em;color:#1F2437;}
  .me-col p{margin-top:6px;color:#667089;font-size:11px;line-height:1.5;}
  .me-note{margin:12px 0 14px;text-align:center;color:#7A84A3;font-size:12px;}
  .me-cta{position:relative;margin:0 0 12px;}
  .me-cta .cta{border-radius:24px;}
  .me-cta em{position:absolute;right:10px;top:-10px;padding:3px 8px;border-radius:10px;background:#EEF0FF;color:var(--primary);font:800 10px inherit;font-style:normal;}
  .me-hint{text-align:center;color:#9AA3BB;font-size:11px;margin-top:8px;}
  .me-vip{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin:14px 0 16px;padding:12px 14px;border:0;border-radius:14px;background:#F4F6FF;color:inherit;font-family:inherit;text-align:left;cursor:pointer;}
  .me-vip b{display:block;font-size:13px;color:#30385A;}
  .me-vip span{display:block;margin-top:3px;color:#7A84A3;font-size:11px;}
  .me-vip i{font-style:normal;color:var(--primary);font-size:12px;font-weight:800;white-space:nowrap;}
  .me-chips{justify-content:space-between;margin-bottom:8px;}
  .me-chips .chip{background:transparent;color:#667089;padding:8px 6px;}
  .me-chips .chip.on{background:transparent;color:var(--primary);box-shadow:inset 0 -2px 0 var(--primary);border-radius:0;}
  .me-spot{position:relative;display:flex;flex-direction:column;align-items:center;padding:28px 0 8px;}
  .me-ava{width:86px;height:86px;border-radius:50%;background:linear-gradient(180deg,#EEF0FF,#D6E4FF);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;box-shadow:0 10px 20px rgba(91,108,255,.16);}
  .me-plus{position:absolute;top:18px;left:50%;transform:translate(-10px,-6px);height:36px;padding:0 14px 0 10px;border:0;border-radius:18px;background:var(--primary);color:#fff;font:800 13px inherit;box-shadow:0 8px 16px #AFCCFF;cursor:pointer;}
  .search{height:39px;border:1.5px solid #D6E4FF;border-radius:20px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;margin:14px 0 12px;}
  .search input{border:none;outline:none;flex:1;font:13px inherit;background:transparent;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:none;background:#EEF0FF;color:var(--t3);font:700 12px inherit;padding:7px 12px;border-radius:100px;cursor:pointer;}
  .chip.on{background:var(--primary);color:#fff;}
  .banner{display:none;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;padding:10px 12px;border-radius:16px;background:#FFF1EB;color:var(--warn);font-size:12px;font-weight:700;}
  .banner.show{display:flex;} .banner.ok{background:#E6F9F4;color:var(--done);}
  .nums{display:flex;justify-content:space-between;margin:10px 0 12px;}
  .nums div{text-align:center;} .nums b{display:block;font-size:18px;} .nums span{font-size:10px;color:var(--t4);}
  .bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--end));}
  .photos{display:flex;gap:8px;flex-wrap:wrap;}
  .ph{width:72px;height:72px;border-radius:14px;background:#EEF0FF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--primary);cursor:pointer;position:relative;border:none;}
  .ph .shot{width:100%;height:100%;border-radius:14px;background:linear-gradient(160deg,#D6E4FF,#EEF0FF);}
  .ph .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#212121;color:#fff;font-size:11px;line-height:18px;}
  textarea,select,input.fld{width:100%;border:1.5px solid #D6E4FF;border-radius:16px;padding:10px 12px;font:13px inherit;outline:none;background:#fff;}
  textarea{min-height:76px;resize:none;}
  textarea:focus,select:focus,input.fld:focus{border-color:var(--primary);}
  .field{margin-bottom:12px;} .field label{display:block;font-size:12px;font-weight:700;color:var(--t3);margin-bottom:6px;}
  .sheet{position:absolute;inset:0;z-index:8;background:linear-gradient(180deg,var(--wash2),#fff);overflow-y:auto;padding:16px 20px 80px;}
  .nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back{width:36px;height:36px;border:none;border-radius:12px;background:#EEF0FF;color:var(--primary);cursor:pointer;font-size:18px;}
  .overlay{position:absolute;inset:0;z-index:12;background:rgba(33,33,33,.45);display:flex;align-items:flex-end;}
  .modal{width:100%;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 6px 16px #AFCCFF;padding:18px 20px 24px;max-height:86%;overflow-y:auto;}
  .modal h3{font-size:18px;font-weight:800;}
  .hint{font-size:12px;color:var(--t4);background:#EEF0FF;border-radius:12px;padding:10px 12px;margin:10px 0 14px;line-height:1.5;}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding:6px 4px 10px;}
  .tab{flex:1;border:none;background:none;cursor:pointer;font-family:inherit;color:var(--t4);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;}
  .tab.on{color:var(--primary);} .tab svg{width:22px;height:22px;}
  .toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(12px);background:#212121;color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:100px;opacity:0;transition:.25s;z-index:20;white-space:nowrap;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .switch{width:42px;height:24px;border-radius:99px;background:#D6E4FF;position:relative;cursor:pointer;border:none;}
  .switch.on{background:var(--primary);} .switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}
  .switch.on i{left:20px;}
  .empty{text-align:center;color:var(--t4);font-size:12px;padding:20px;}
  .step{display:flex;gap:6px;margin:16px 0 6px;}
  .step span{flex:1;height:6px;border-radius:99px;background:#E4E8F6;}
  .step span.on{background:var(--primary);}
  .step-labs{display:flex;justify-content:space-between;margin:0 0 16px;color:#8A93B0;font-size:11px;font-weight:700;}
  .step-labs span.on{color:var(--primary);}
  .demo{text-align:center;font-size:10px;color:#bbb;margin-top:16px;}
  .dayline{display:flex;align-items:center;justify-content:space-between;margin:7px 0 16px;color:var(--t3);font-size:12px;}
  .dayline b{color:var(--t1);font-size:12px;}
  .focus{padding:17px 16px 16px;border-radius:20px;background:#202744;color:#fff;box-shadow:0 12px 24px rgba(32,39,68,.2);}
  .focus .eyebrow{font-size:10px;letter-spacing:.08em;color:#BBC4FF;font-weight:800;}
  .focus h2{font-size:18px;line-height:1.35;margin:7px 0 6px;letter-spacing:-.02em;}
  .focus p{font-size:12px;line-height:1.5;color:#DCE1FF;}
  .focus .reason{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:11px;color:#DCE1FF;}
  .focus .reason i{display:block;width:6px;height:6px;border-radius:50%;background:#91E5D3;}
  .focus .go{display:flex;align-items:center;justify-content:center;width:100%;height:42px;border:0;border-radius:14px;margin-top:14px;background:#fff;color:#202744;font:800 13px inherit;cursor:pointer;}
  .strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:3px;}
  .strip::-webkit-scrollbar{display:none;}
  .signal{min-width:228px;scroll-snap-align:start;padding:13px 14px;border-radius:16px;background:#fff;border:1px solid #E7E9F5;cursor:pointer;text-align:left;font-family:inherit;color:inherit;}
  .signal .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:5px;}
  .signal .name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .signal p{font-size:11.5px;color:var(--t3);line-height:1.45;}
  .section-note{font-size:11px;color:var(--t4);font-weight:500;}
  .action-list .row{padding:13px 14px;}
  .action-list .ico{width:36px;height:36px;border-radius:11px;font-size:15px;}

function bindWaveHold(autoSend){
  const bar=$("waveBar"), hint=$("recHint");
  if(!bar) return;
  let sent=false;
  const finish=ok=>{
    if(sent) return; sent=true;
    if(ok){ S.voiceHadResult=true; S.voiceFlow="result"; }
    else { S.voiceFlow=S.voiceHadResult?"result":"idle"; }
    save(); redrawVoice();
  };
  if(autoSend) setTimeout(()=>finish(true),1400);
  bar.onpointerdown=e=>{
    e.preventDefault();
    sent=false;
    S.voiceFlow="listening";
    bar.classList.add("on"); bar.classList.remove("cancel");
    if(hint){ hint.textContent="松开发送，上滑取消"; hint.classList.remove("cancel"); }
    let y=e.clientY, cancel=false;
    const move=ev=>{
      cancel=y-ev.clientY>52;
      bar.classList.toggle("cancel",cancel);
      if(hint){ hint.textContent=cancel?"松开取消":"松开发送，上滑取消"; hint.classList.toggle("cancel",cancel); }
    };
    const up=()=>{
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",up);
      finish(!cancel);
    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  };
}

function growthStat(){
  const visits=S.visits.length+22;

  const levels=[{n:"铜牌督导",min:0},{n:"银牌督导",min:500},{n:"金牌督导",min:1200},{n:"黑金督导",min:2000}];
  let lv=levels[0], next=levels[1];
  levels.forEach((x,i)=>{ if(pts>=x.min){ lv=x; next=levels[i+1]||null; } });
  const span=(next?next.min:lv.min+800)-lv.min;
  const pct=next?Math.min(100,Math.round((pts-lv.min)/span*100)):100;
  const remain=next?next.min-pts:0;
  const logs=[
    ...S.visits.slice(-3).reverse().map(v=>({t:`有效拜访 ${store(v.storeId)?store(v.storeId).name:""}`,p:"+20",d:(v.time||"").slice(0,5)||"今日"})),

    {t:"连续 5 天完成拜访计划",p:"+40",d:"09-19"}
  ].slice(0,5);
  return {visits,closed,cases,pts,lv:lv.n,next:next&&next.n,pct,remain,logs};
}

function scheduleReceiptJob(job){clearTimeout(receiptJobTimers[job.id]);receiptJobTimers[job.id]=setTimeout(()=>{delete receiptJobTimers[job.id];if(!(S.receiptJobs||[]).includes(job)||job.stage!=='recognizing')return;if(job.failResult){job.stage='failed';job.failureReason='暂未识别出票据信息，请重新识别或更换清晰图片';try{save();}catch(err){toast('识别状态暂未保存，请勿刷新页面');}refreshReceiptList();if(receiptFlow===job&&$('overlay').dataset.expense)receiptFailure();else toast('票据识别失败，可在报销列表重试');return;}job.fields={type:'交通出行',amount:'48,000',date:visitDate(),merchant:'Transporte Demo',number:'DEMO-001'};job.stage='review';try{save();}catch(err){toast('识别结果暂未保存，请勿刷新页面');}refreshReceiptList();if(receiptFlow===job&&$('overlay').dataset.expense)receiptReview();else toast('票据识别完成，可在报销列表查看');},Math.max(0,job.readyAt-Date.now()));}
function receiptRecognize(source,name,image){if(!receiptFlow)return;const job={id:'receipt-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),stage:'recognizing',source,filename:name,fields:null,readyAt:Date.now()+6000,simulated:!image,failResult:!!($('receiptFailureDemo')&&$('receiptFailureDemo').checked)};Object.defineProperty(job,'image',{value:image||receiptDemoImage(),writable:true,enumerable:false});S.receiptJobs=S.receiptJobs||[];S.receiptJobs.unshift(job);S.cf='待提交';try{save();}catch(err){S.receiptJobs=S.receiptJobs.filter(j=>j.id!==job.id);toast('暂存失败，请重新选择较小的图片');return;}receiptFlow=job;showReceiptRecognizing();refreshReceiptList();scheduleReceiptJob(job);}
function resumeReceiptJob(id){const job=(S.receiptJobs||[]).find(j=>j.id===id);if(!job)return;clearTimeout(receiptTimer);receiptFlow=job;job.submitting=false;if(!job.image&&job.simulated)Object.defineProperty(job,'image',{value:receiptDemoImage(),writable:true,enumerable:false});if(job.stage==='recognizing'){showReceiptRecognizing();scheduleReceiptJob(job);}else if(job.stage==='failed')receiptFailure();else receiptReview();}
function receiptFailure(){const r=receiptFlow;if(!r)return;receiptShell('票据识别失败',`<div class="receipt-complete receipt-failed"><span>!</span><div><b>识别失败</b><small>${escapeAsr(r.failureReason)}</small></div></div><div class="receipt-preview">${r.image?`<img src="${r.image}" alt="本次票据图片">`:""}<b>${escapeAsr(r.filename)}</b></div><button class="cta" data-act="expenseretry">重新识别</button><button class="cta ghost" data-act="expensereplace">重新上传 / 拍照</button>`);}
function retryReceipt(){const job=receiptFlow;if(!job||job.stage!=='failed')return;job.stage='recognizing';job.failResult=!!($('receiptFailureDemo')&&$('receiptFailureDemo').checked);job.readyAt=Date.now()+6000;delete job.failureReason;try{save();}catch(err){toast('识别状态暂未保存，请勿刷新页面');}showReceiptRecognizing();refreshReceiptList();scheduleReceiptJob(job);}

function receiptSubmit(){const r=receiptFlow;if(!r||r.stage!=='review'||r.submitting)return;const raw=$('eamount').value.trim(),date=$('edate').value,type=$('etype').value;const error=$('receiptError');r.fields={type,amount:raw,date,merchant:$('emerchant').value.trim(),number:$('enumber').value.trim()};r.submitting=true;error.textContent='';$('receiptSubmit').disabled=true;$('receiptSubmit').textContent='提交中…';receiptTimer=setTimeout(()=>{if(receiptFlow!==r)return;const f=r.fields,id='e'+Date.now(),record={id,...f,source:r.source,filename:r.filename};S.expenses.unshift(record);S.tickets.unshift({id,type:'报销',title:`报销单 · COP ${f.amount}`,owner:'我自己跟进',status:'待处理',ev:'票据识别结果已确认'});const previous=S.cf,previousJobs=S.receiptJobs||[];S.receiptJobs=previousJobs.filter(j=>j.id!==r.id);S.cf='已提交';try{save();}catch(err){S.expenses=S.expenses.filter(e=>e.id!==id);S.tickets=S.tickets.filter(t=>t.id!==id);S.cf=previous;S.receiptJobs=previousJobs;r.submitting=false;$('receiptSubmit').disabled=false;$('receiptSubmit').textContent='提交识别结果';$('receiptError').textContent='保存失败，请重试';return;}closeOverlay();renderCollab();toast('报销单已提交，进入待处理');},600);}

function makeTasks(s, chips){
  const names=chips.map(id=>CHIPS.find(c=>c.id===id)?.t).filter(Boolean);
  const rules=[{if:["credit"],title:"复核该店可用额度并回写来源"},{if:["price"],title:"发起价格/促销授权协同"},{if:["pop","disp"],title:"登记物料/陈列资源申请"},{if:["svc"],title:"催办售后配件"},{if:["train"],title:"安排店员主推培训"},{if:["demo"],title:"申请样机上门演示"},{if:["rel","away"],title:"预约决策人二次拜访"},{if:["stock"],title:"跟进 Pova 到货日，避免空台面"}];
  const made=[];
  rules.forEach(r=>{ if(r.if.some(x=>chips.includes(x))) made.push({id:"k"+Date.now()+made.length,title:r.title,store:s.name,from:names.slice(0,2).join(" / ")||"拜访记录",done:false,visit:true}); });
  if(!made.length) made.push({id:"k"+Date.now(),title:"回访确认今日沟通结论",store:s.name,from:"拜访记录",done:false,visit:true});
  return made;
}

    const s=store(el.dataset.call); if(!s) return;
    revealOverlay();
    $("overlay").innerHTML=`<div class="modal"><h3>发消息给 ${s.owner}</h3><div class="hint">${s.name} · 用于先同步到货、额度和回访时间</div><div class="chips" id="chatchips" style="margin-bottom:12px">${["确认额度是否刷新","本周能否见到店主","到货后通知我"].map((t,i)=>`<button class="chip ${i===0?"on":""}" data-msg="${t}">${t}</button>`).join("")}</div><button class="cta" data-act="chatsend" data-call="${s.id}">发送</button></div>`;
    return;
  }
  if(a==="chatsend"){ closeOverlay(); persist("消息已发给店主"); return; }

  if(a==="callend"){
    const s=store($("overlay").dataset.call);
    const rec=!!S.callRec;
    if(rec&&s) S.visits.push({storeId:s.id,time:now(),chips:["语音沟通"],note:`通话已录制：${storeWhy(s)}`});
    S.callRec=false; closeOverlay(); toast(rec?"已挂断，录音已保存":"已挂断"); return;
  }
  if(a==="goal"||a==="goalsales"||a==="goalincentive"){
    revealOverlay();
    $("overlay").innerHTML=`<div class="modal goal-sheet"><h3>${a==="goalincentive"?"激励情况":"销售达成情况"}</h3>
      ${a==="goalincentive"?`<div class="hint">本月已赚 COP 2.34M · 今日 +COP 86K · 超越 86% 同区督导</div>
        <div class="nums"><div><b>2.34M</b><span>本月激励</span></div><div><b>+86K</b><span>今日新增</span></div><div><b>86%</b><span>同区排名</span></div></div>
        <div class="income-lines">基础提成 <b>1.68M</b><br>超额奖金 <b>460K</b><br>新拓店奖励 <b>200K</b></div>`:
        `<div class="hint">9 月目标 4,300 台 · 已完成 3,420 台 · 还需 880 台</div>
        <div class="nums"><div><b>79.5%</b><span>完成率</span></div><div><b>126</b><span>今日销量</span></div><div><b>+300</b><span>领先同区</span></div></div>
        <div class="bar"><i style="width:79.5%"></i></div>
        <div class="series"><span class="series-head"><span>分系列达成</span><span>台</span></span>
          <span class="series-row"><i></i><span class="series-name">ZERO · GT</span><span class="series-bar"><b style="width:72%"></b></span><strong>360/500</strong></span>
          <span class="series-row"><i></i><span class="series-name">NOTE</span><span class="series-bar"><b style="width:80%"></b></span><strong>880/1100</strong></span>
          <span class="series-row"><i></i><span class="series-name">HOT</span><span class="series-bar"><b style="width:55%"></b></span><strong>440/800</strong></span>
        </div>`}
      <button class="cta" style="margin-top:16px" ${$("p-me")&&!$("p-me").classList.contains("hidden")?'data-act="closegoal"':'data-tab="fight"'}>${$("p-me")&&!$("p-me").classList.contains("hidden")?"返回我的":"返回今日作战"}</button></div>`;
    return;
  }
  if(a==="closegoal"){ closeOverlay(); return; }
  if(a==="menu"){ toast("菜单入口已收起，专注今日作战"); return; }
  if(a==="recommend"){ S.recPage=(S.recPage||0)+1; save(); renderFight(); toast("已换一批建议门店"); return; }
  if(a==="voiceask"){
    S.voiceFrom="fight"; S.voiceTopic=CASE_TOPICS.includes(S.voiceTopic)?"visit":(S.voiceTopic||"visit");
    S.voiceHadResult=false; S.voiceFlow="listening"; save(); renderFight();
  }
  if(a==="casevoice"){
    S.voiceFrom="cases"; S.voiceTopic=CASE_TOPICS.includes(S.voiceTopic)?S.voiceTopic:"price";
    S.voiceHadResult=false; S.voiceFlow="listening"; save(); renderCases();
  }
  if(a==="asktype"){ S.askMode="text"; save(); redrawAskDock(); return; }
  if(a==="askvoice"){ S.askMode="voice"; save(); redrawAskDock(); return; }
  if(a==="caseask"){ S.askMode="text"; save(); redrawAskDock(); return; }
  if(a==="casesearch"){ sendTypedAsk("cases",(($("caseAsk")||$("caseQ")||{}).value||"")); return; }
  if(a==="home-send-case"){ sendTypedAsk("cases",(($("caseAsk")||{}).value||"")); return; }
  if(a==="voicecancel"){ S.voiceFlow="idle"; S.voiceHadResult=false; document.querySelector(".phone").classList.remove("talking"); save(); redrawVoice(); }
  if(a==="diagnose"){ revealOverlay(); $("overlay").innerHTML=`<div class="modal"><h3>经营诊断</h3><div class="hint">输入门店名称后，小巡会汇总最近拜访、账期、库存和协同事项，形成一条可执行建议。</div><div class="field"><label>要诊断哪家门店？</label><input class="fld" placeholder="例如：Celulares El Dorado"></div><button class="cta" data-tab="stores">去门店360查看</button></div>`; return; }
  if(a==="overdue"){ S.homeFilter="全部"; save(); renderFight(); setTimeout(()=>document.querySelector(".ai-store-list")?.scrollIntoView({behavior:"smooth",block:"center"}),0); toast("已定位久未拜访门店"); }
  if(a==="home-send"){ sendTypedAsk("fight",(($("homeAsk")||{}).value||"")); return; }
  if(a==="ask"){ S.askMode="text"; save(); redrawAskDock(); return; }
  if(a==="history"){ $("sheet").classList.remove("hidden"); $("sheet").innerHTML=`<div class="nav"><button class="back" id="closeSheet">‹</button><h3 style="font-size:18px">全部访店历史</h3></div><div class="sub">按日期倒序；门店详情默认仅用最新有效信息辅助决策</div><div class="card" style="margin-top:16px">${STORES.flatMap(s=>s.hist.map(v=>({s,v}))).sort((a,b)=>b.v.d.localeCompare(a.v.d)).map(x=>`<button class="row" data-store="${x.s.id}"><div class="ico">📝</div><div class="bd"><div class="t">${x.v.d} · ${x.s.name}</div><div class="s">${x.v.t}</div></div></button>`).join("")}</div>`; $("closeSheet").onclick=()=>$("sheet").classList.add("hidden"); }
  if(a==="growth"){
    const g=growthStat();
    $("sheet").classList.remove("hidden");
    $("sheet").innerHTML=`<div class="nav"><button class="back" id="closeSheet">‹</button><h3 style="font-size:18px;font-weight:800">积分明细</h3></div>
      <div class="card grow-card" style="margin-top:8px"><div class="grow-top"><div><div class="sub">本月积分</div><b class="grow-pts">${g.pts.toLocaleString()}</b></div><span class="tag">${g.lv}</span></div><div class="bar"><i style="width:${g.pct}%"></i></div><div class="sub">${g.next?`距${g.next}还差 ${g.remain} 分`:"已到达当前最高等级"}</div></div>
      <div class="sec"><h2>怎么拿分</h2></div>
      <div class="card">${[["有效拜访","完成一次带留资的门店拜访","+20"],["协同闭环","事项变为已完成并留下证据","+30"],["案例学习","看完一条金牌话术或案例","+15"],["连续出勤","连续 5 天完成拜访计划","+40"]].map(x=>`<div class="row" style="cursor:default"><div class="ico">＋</div><div class="bd"><div class="t">${x[0]}</div><div class="s">${x[1]}</div></div><span class="tag ok">${x[2]}</span></div>`).join("")}</div>
      <div class="sec"><h2>最近记录</h2></div>
      <div class="card">${g.logs.map(x=>`<div class="row" style="cursor:default"><div class="ico">＋</div><div class="bd"><div class="t">${x.t}</div><div class="s">${x.d}</div></div><span class="tag ok">${x.p}</span></div>`).join("")}</div>
      <div class="demo">积分只回看工作沉淀，不另开抽奖或商城</div>`;
    $("closeSheet").onclick=()=>{ $("sheet").classList.add("hidden"); $("sheet").innerHTML=""; };
  }
  if(a==="case"){
    $("sheet").classList.remove("hidden");
    $("sheet").innerHTML=`<div class="nav"><button class="back" id="closeSheet">‹</button><h3 style="font-size:18px;font-weight:800">金牌话术</h3></div><span class="tag ok">谈判 / 价格异议</span><h1 style="font-size:21px;margin-top:12px">客户说“竞品更便宜”时，先谈什么？</h1><div class="sub">适用于价格敏感、仍有合作意愿的门店</div><section class="card" style="margin-top:18px;padding:16px"><div style="font-size:11px;font-weight:800;color:var(--warn);letter-spacing:.06em">问题</div><h3 style="font-size:16px;margin:8px 0 6px">客户只在比较单台进货价</h3><p style="font-size:12px;line-height:1.65;color:#666">直接降价会伤害价盘，也没有回应他对库存消化和后续跳价的担忧。</p></section><section class="card" style="margin-top:12px;padding:16px"><div style="font-size:11px;font-weight:800;color:var(--done);letter-spacing:.06em">解决方案</div><h3 style="font-size:16px;margin:8px 0 6px">从“低价”转为“稳定利润 + 共担动销”</h3><ol style="margin:8px 0 0 18px;color:#666;font-size:12px;line-height:1.8"><li>先确认库存与目标客群，避免盲目压货。</li><li>用稳定价盘解释单台利润，不只比较采购价。</li><li>给出小批试单和陪同消化库存的承诺。</li></ol></section><section class="card" style="margin-top:12px;padding:16px;background:#F4F5FF"><div style="font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.06em">建议话术</div><p style="font-size:13px;line-height:1.7;color:#30365A;margin-top:8px">“我们先用一小批试单，我会和店员一起把库存消化掉；价格稳定，你不用担心后续跳价亏损。”</p></section><button class="cta" style="margin-top:18px" data-tab="stores">带着方案去看门店</button>`;
    $("closeSheet").onclick=()=>{ $("sheet").classList.add("hidden"); $("sheet").innerHTML=""; };
  }
  if(a==="repair"){ revealOverlay(); $("overlay").innerHTML=`<div class="modal"><h3>报修与服务</h3><div class="hint">拍照或语音描述问题后，系统将生成售后协同事项并回写门店历史。</div><button class="receipt-shot" data-act="repairdone"><b>🔧</b>拍摄故障照片<small>用于生成本机演示报修草稿</small></button></div>`; return; }
  if(a==="repairdone"){ closeOverlay(); S.tickets.unshift({id:"r"+Date.now(),type:"售后",store:"s3",title:"待确认的门店报修",owner:"售后协调员 Rosa",due:"09-23",status:"待处理",ev:"照片待同步"}); persist("报修草稿已创建，已进入协作待办"); renderMe(); return; }
  if(a==="togglenet"){ S.offline=!S.offline; save(); toast(S.offline?"已切到弱网":"已切回在线"); showTab("me"); }
  if(a==="online"){ S.offline=false; save(); showTab(document.querySelector(".tab.on").dataset.tab); }
  if(a==="sync"){ const n=S.queue; S.queue=0; S.offline=false; save(); toast(n?`已同步 ${n} 条本地记录`:"没有待同步记录"); showTab(document.querySelector(".tab.on").dataset.tab); }
  if(a==="reset"){ localStorage.removeItem(KEY); S=load(); toast("已恢复演示数据"); showTab("me"); }
});
if(S.visit&&S.visit.step===2){save();S.visit=freshVisit(1,"");save();}
if(window.todoPreviewScene){resumeVisit("s2","stores",window.todoPreviewScene);showTab("visit");}else showTab("fight");
resumeReports();
</script>
</body>
</html>
