<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡店待办配置 · 管理后台</title>
<style>
:root{--p:#5b6cff;--ink:#20263b;--muted:#8590a5;--line:#edf0f6}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:var(--ink);font:14px "Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--p);outline-offset:2px}.shell{display:flex;min-height:100vh}.sidebar{width:210px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:30px 18px}.logo{font-size:18px;font-weight:800;margin:0 0 48px}.logo span{display:inline-grid;place-items:center;background:var(--p);color:#fff;width:30px;height:30px;border-radius:10px;margin-right:9px}.nav-label{font-size:11px;color:var(--muted);margin:0 12px 12px}.nav-active{padding:13px;border-radius:12px;background:#eef0ff;color:var(--p);font-weight:700}.main{flex:1;min-width:0;padding:34px 38px}.bread{font-size:12px;color:var(--muted);margin-bottom:17px}.head{display:flex;justify-content:space-between;align-items:center;gap:18px}.head h1{font-size:26px;margin:0}.head p{font-size:13px;color:var(--muted);margin:10px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #dfe4f0;border-radius:10px;background:#fff;padding:10px 15px;color:#5e6881}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.saved{font-size:12px;color:var(--muted);margin:20px 0}.content{display:block}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs{display:flex;padding:4px;background:#f3f5fa;border-radius:12px}.tabs button{border:0;background:none;padding:10px 19px;border-radius:9px;color:#8290a7}.tabs button.on{background:#fff;color:var(--p);box-shadow:0 2px 8px #dfe4ee;font-weight:700}.summary{padding:15px 22px;color:#8993a7;font-size:12px}.summary b{color:var(--ink)}table{width:100%;border-collapse:collapse;table-layout:fixed}th{font-weight:500;font-size:12px;background:#fafbfe;color:#8590a5;text-align:left;padding:12px}td{padding:17px 12px;border-bottom:1px solid var(--line);vertical-align:middle}th:first-child,td:first-child{padding-left:22px;width:55px}.table-wrap{overflow-x:auto}table{min-width:760px}.score-rule{font-size:12px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;max-height:122px;overflow-y:auto}.score-empty{color:var(--muted)}.task-name{font-weight:700;font-size:13px;overflow-wrap:anywhere}.task-tip{font-size:12px;color:#8993a7;line-height:1.65;margin-top:5px;overflow-wrap:anywhere}.rank{display:inline-flex;align-items:center;justify-content:center;background:#f0f2ff;color:var(--p);width:25px;height:25px;border-radius:8px}.toggle{width:32px;height:19px;border:0;border-radius:15px;background:#dce1ed;padding:3px}.toggle:before{content:"";display:block;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s}.toggle.on{background:var(--p)}.toggle.on:before{transform:translateX(13px)}.row-tools{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap}.row-tools button{flex-shrink:0}.icon-btn{border:0;background:#f3f5fb;border-radius:6px;padding:5px 7px;font-size:12px;color:#74809a}.text-btn{border:0;background:none;color:var(--p);font-size:12px;padding:5px}.danger{color:#ee7b6c}.off{background:#fcfcfe}.off .task-name{color:#a0a8b6}.panel-foot{padding:16px 22px;font-size:12px;color:#939caf}.modal-mask{position:fixed;inset:0;background:#20263b50;display:flex;justify-content:center;align-items:center;z-index:10;padding:20px}.hidden{display:none!important}.modal{background:#fff;border-radius:20px;padding:26px;width:560px;max-width:100%;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 20px 70px #20263b30}.modal h2{font-size:19px;margin:0 0 22px}.field{margin:18px 0}.field label{display:block;font-size:13px;margin-bottom:9px}.field input,.field textarea{width:100%;border:1px solid #dfe4f0;border-radius:10px;padding:11px;color:var(--ink)}.field textarea{resize:vertical;min-height:95px}.check-line{display:flex;gap:25px;margin:18px 0}.check-line label{display:flex;gap:7px;align-items:center}.check-line input{accent-color:var(--p)}.help{color:var(--muted);font-size:11px;margin-top:6px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.error{font-size:12px;color:#ec6b61;min-height:18px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#27304b;color:#fff;border-radius:12px;padding:12px 22px;z-index:20} @media(max-width:1200px){.sidebar{width:170px}.main{padding:28px 22px}.head{align-items:flex-start;flex-direction:column}}@media(max-width:700px){.sidebar{display:none}.main{padding:20px 10px}.table-wrap{overflow-x:auto}.panel-head{flex-wrap:wrap}.head h1{font-size:23px}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="logo"><span>巡</span>督导管理后台</div><div class="nav-label">业务配置</div><div class="nav-active">巡店待办配置</div></aside><main class="main"><div class="bread">业务配置 / 巡店待办</div><header class="head"><div><h1>巡店待办配置</h1><p>电话与到店事项分别维护，按启用状态及顺序展示在移动端。</p></div><div class="actions"><button class="btn primary" id="saveBtn">保存配置</button></div></header><div class="saved" id="saveState" aria-live="polite"></div><div class="content"><section class="panel"><div class="panel-head"><div class="tabs" role="tablist"><button class="on" role="tab" id="onsiteTab" data-scene="onsite">到店巡店</button><button role="tab" id="phoneTab" data-scene="phone">电话拜访</button></div><button class="btn primary" id="addBtn">＋ 新增事项</button></div><div class="summary" id="summary"></div><div class="table-wrap"><table><thead><tr><th>顺序</th><th>事项名称 / 检查提示</th><th style="width:36%">字段评分规则</th><th style="width:62px">启用</th><th style="width:180px">操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="panel-foot">每类至少启用 1 项，最多配置 30 项。停用事项不在移动端展示。字段评分规则用于描述 AI 对该事项的评分依据。</div></section></div></main></div>
<div class="modal-mask hidden" id="editor"><form class="modal" id="editorForm"><h2 id="editorTitle">新增事项</h2><div class="field"><label for="taskTitle">事项名称</label><input id="taskTitle" maxlength="50" required placeholder="例如：库存与动销"><div class="help">必填，最多 50 字</div></div><div class="field"><label for="taskTip">检查提示</label><textarea id="taskTip" maxlength="160" placeholder="说明需要了解、检查或沟通的内容"></textarea><div class="help">最多 160 字</div></div><div class="field"><label for="taskScoreRule">字段评分规则</label><textarea id="taskScoreRule" maxlength="2000" placeholder="例如：满分 10 分；陈列位置符合要求得 4 分，物料齐全得 3 分，样机可正常体验得 3 分。缺少照片或描述等证据时标记为待补充，不推测得分。"></textarea><div class="help">选填，最多 2000 字。请说明满分、评分条件、扣分标准及证据不足时的处理方式。</div></div><div class="check-line"><label><input id="taskEnabled" type="checkbox" checked>启用</label></div><div class="error" id="editorError" role="alert"></div><div class="modal-actions"><button class="btn" id="editorCancel" type="button">取消</button><button class="btn primary" type="submit">确定</button></div></form></div><div class="toast hidden" id="toast" role="status"></div>
<script>
const KEY="supervisor-todo-config-v1",META="supervisor-todo-config-meta-v1";
const defaults=[{id:"display",chip:"disp",t:"品牌陈列与露出",tip:"POP / 挂旗 / dummy / 样机、竞品占多少",hot:true,enabled:true},{id:"stock",chip:"stock",t:"库存与动销",tip:"分机型库存、慢销机型",hot:true,enabled:true},{id:"compete",chip:"price",t:"竞品情况",tip:"品牌占比、价差、返利、灰市水货",hot:true,enabled:true},{id:"train",chip:"train",t:"人员与培训",tip:"店员讲不讲得清卖点",hot:false,enabled:true},{id:"material",chip:"demo",t:"物料 / 样机是否到位",tip:"核对申请物料、dummy 和样机是否到店",hot:false,enabled:true},{id:"trace",chip:"pop",t:"现场留痕",tip:"勾选 + 照片 + 语音，弱网先存",hot:false,enabled:true}];
const clone=v=>JSON.parse(JSON.stringify(v)),fresh=()=>({onsite:clone(defaults),phone:clone(defaults)}),$=id=>document.getElementById(id),esc=v=>String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function validate(config){if(!config||!Array.isArray(config.onsite)||!Array.isArray(config.phone))throw Error("配置需包含到店和电话两类事项");const clean={};for(const scene of ["onsite","phone"]){if(config[scene].length>30)throw Error("每类最多配置30项");const ids=new Set();clean[scene]=config[scene].map(q=>{if(!q||typeof q.id!=="string"||!q.id||ids.has(q.id)||typeof q.t!=="string"||!q.t.trim()||q.t.length>50||typeof q.tip!=="string"||q.tip.length>160)throw Error("事项字段无效或编号重复");if(q.scoreRule!==undefined&&(typeof q.scoreRule!=="string"||q.scoreRule.length>2000))throw Error("字段评分规则需为文本，最多2000字");ids.add(q.id);return {id:q.id,t:q.t.trim(),tip:q.tip,scoreRule:(q.scoreRule||""),hot:!!q.hot,enabled:q.enabled!==false,chip:typeof q.chip==="string"?q.chip:""};});if(!clean[scene].some(q=>q.enabled))throw Error((scene==="onsite"?"到店巡店":"电话拜访")+"至少需启用1项");}return clean;}
let saved;try{saved=validate(JSON.parse(localStorage.getItem(KEY)||"null"));}catch(e){saved=fresh();}let draft=clone(saved),scene="onsite",editingId=null,toastTimer;const dirty=()=>JSON.stringify(draft)!==JSON.stringify(saved);
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),2400);}
function render(){const list=draft[scene],active=list.filter(q=>q.enabled);document.querySelectorAll('[data-scene]').forEach(b=>{b.classList.toggle('on',b.dataset.scene===scene);b.setAttribute('aria-selected',String(b.dataset.scene===scene));});$("summary").innerHTML=`共 <b>${list.length}</b> 项 · 已启用 <b>${active.length}</b> 项`;$("saveState").textContent=dirty()?"有未保存修改 · 请点击保存配置":"当前配置已保存 · "+(localStorage.getItem(META)||"默认配置");$("saveBtn").disabled=!dirty();$("rows").innerHTML=list.map((q,i)=>`<tr class="${q.enabled?'':'off'}"><td><span class="rank">${i+1}</span></td><td><div class="task-name">${esc(q.t)}</div><div class="task-tip">${esc(q.tip)||'—'}</div></td><td><div class="score-rule ${q.scoreRule?'':'score-empty'}">${esc(q.scoreRule)||'未配置'}</div></td><td><button class="toggle ${q.enabled?'on':''}" role="switch" aria-label="${esc(q.t)}启用" aria-checked="${q.enabled}" data-action="enabled" data-id="${esc(q.id)}"></button></td><td><div class="row-tools"><button class="icon-btn" data-action="up" data-id="${esc(q.id)}" ${i===0?'disabled':''} aria-label="上移">↑</button><button class="icon-btn" data-action="down" data-id="${esc(q.id)}" ${i===list.length-1?'disabled':''} aria-label="下移">↓</button><button class="text-btn" data-action="edit" data-id="${esc(q.id)}">编辑</button><button class="text-btn danger" data-action="delete" data-id="${esc(q.id)}">删除</button></div></td></tr>`).join('');}

function edit(id){editingId=id;const q=id?draft[scene].find(v=>v.id===id):{t:'',tip:'',hot:false,enabled:true};$("editorTitle").textContent=(id?'编辑':'新增')+(scene==='onsite'?'到店':'电话')+'事项';$("taskTitle").value=q.t;$("taskTip").value=q.tip;$("taskScoreRule").value=q.scoreRule||"";$("taskEnabled").checked=q.enabled;$("editorError").textContent='';$("editor").classList.remove('hidden');$("taskTitle").focus();}
function closeEditor(){$("editor").classList.add('hidden');editingId=null;}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render();});$("addBtn").onclick=()=>draft[scene].length>=30?toast('每类最多配置30项'):edit(null);$("editorCancel").onclick=closeEditor;$("editor").onclick=e=>{if(e.target===$("editor"))closeEditor();};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor();});
$("editorForm").onsubmit=e=>{e.preventDefault();const title=$("taskTitle").value.trim();if(!title){$("editorError").textContent='请填写事项名称';return;}if(draft[scene].some(q=>q.id!==editingId&&q.t.trim()===title)){$("editorError").textContent='当前场景已有同名事项';return;}const item={id:editingId||'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),t:title,tip:$("taskTip").value.trim(),scoreRule:$("taskScoreRule").value.trim(),hot:editingId?draft[scene].find(q=>q.id===editingId).hot:false,enabled:$("taskEnabled").checked,chip:editingId?draft[scene].find(q=>q.id===editingId).chip:''};if(editingId)draft[scene][draft[scene].findIndex(q=>q.id===editingId)]=item;else draft[scene].push(item);closeEditor();render();};
$("rows").onclick=e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const list=draft[scene],i=list.findIndex(q=>q.id===b.dataset.id);if(i<0)return;const a=b.dataset.action;if(a==='edit'){edit(list[i].id);return;}if(a==='delete'){if(!confirm('删除“'+list[i].t+'”？保存后生效。'))return;list.splice(i,1);}if(a==='enabled')list[i].enabled=!list[i].enabled;if(a==='up'&&i>0)[list[i-1],list[i]]=[list[i],list[i-1]];if(a==='down'&&i<list.length-1)[list[i+1],list[i]]=[list[i],list[i+1]];render();};
$("saveBtn").onclick=()=>{try{const clean=validate(draft);localStorage.setItem(KEY,JSON.stringify(clean));localStorage.setItem(META,new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}));saved=clean;draft=clone(clean);render();toast('两类待办配置已保存');}catch(e){toast(e.message||'保存失败，请重试');}};
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
